[project]
name = "githeal"
version = "1.0.0"
description = "Autonomous API schema self-healing workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "requests>=2.31.0",
    "jsonschema>=4.18.0",
    "pydantic>=2.0.0",
]

[tool.uv]
exclude-newer = "30 days"

[tool.setuptools]
packages = ["tools"]
