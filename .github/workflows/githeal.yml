name: GitHeal API Schema Self-Healing

on:
  schedule:
    # Run once a day (change as needed)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv pip install -e .

      - name: Start Mock Server & Toggle Drift
        run: |
          # Start the mock server in the background
          uv run uvicorn tools.mock_server:app --port 8000 &
          # Wait 3 seconds for it to start
          sleep 3
          # Toggle it to drifted mode
          curl -X POST http://127.0.0.1:8000/toggle-drift

      - name: Run Schema Validation & Healing
        id: githeal
        run: |
          # Try to run validation. If it fails and heals, exit code is 2.
          # We store the exit code to determine the next steps.
          exit_code=0
          uv run python tools/api_fetcher.py --validate --heal || exit_code=$?
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Configure Git User
        if: steps.githeal.outputs.exit_code == '2'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute GitClaw Post-Heal Hooks
        if: steps.githeal.outputs.exit_code == '2'
        run: |
          uv run python tools/gitclaw_hooks.py

      - name: Create Pull Request on GitHub
        if: steps.githeal.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract metadata from the generated pr_payload.json file
          BRANCH_NAME=$(python -c "import json; print(json.load(open('pr_payload.json'))['source_branch'])")
          PR_TITLE=$(python -c "import json; print(json.load(open('pr_payload.json'))['title'])")
          PR_BODY=$(python -c "import json; print(json.load(open('pr_payload.json'))['body'])")
          
          # Push the branch cut by the hooks script
          git push origin "$BRANCH_NAME"
          
          # Create PR using GitHub CLI (built-in on ubuntu-latest runners)
          echo "$PR_BODY" | gh pr create --title "$PR_TITLE" --body-file - --head "$BRANCH_NAME" --base main
